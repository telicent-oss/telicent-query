name: Dependabot auto-merge

on:
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["test-feature-branch.yml", "vulnerability-scanning.yml", "Lint Helm Charts", "Test Helm chart", "Metadata Updater"]
    types: [completed]

permissions:
  contents: read

jobs:
  automerge:
    uses: telicent-oss/shared-workflows/.github/workflows/dependabot-automerge.yml@main
    permissions:
      actions: read
      contents: read
      pull-requests: write
    with:
      vulnerability-workflow: vulnerability-scanning.yml
      vulnerability-job-prefix: Vulnerability scanning
    secrets:
      MERGEBOT_CLIENT_ID: ${{ secrets.MERGEBOT_CLIENT_ID }}
      MERGEBOT_PRIVATE_KEY: ${{ secrets.MERGEBOT_PRIVATE_KEY }}
