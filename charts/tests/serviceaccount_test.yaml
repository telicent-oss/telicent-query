suite: ServiceAccount tests 

templates:
  - charts/query-ui/templates/serviceaccount.yaml

set:
  serviceAccount:
    create: true
    name: query-ui-test
    automount: true

tests:
  - it: should create a ServiceAccount when enabled
    asserts:
      - isKind:
          of: ServiceAccount

  - it: should not create a ServiceAccount when disabled
    set:
      serviceAccount:
        create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should use the given ServiceAccount name
    asserts:
      - equal:
          path: metadata.name
          value: query-ui-test

  - it: should use the release namespace by default
    release:
      namespace: query-ui-test
    asserts:
      - equal:
          path: metadata.namespace
          value: query-ui-test

  - it: should use the namespace override when given
    release:
      namespace: query-ui-test
    set:
      namespaceOverride: unit-test
    asserts:
      - equal:
          path: metadata.namespace
          value: unit-test

  - it: should set automountServiceAccountToken to true
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: true

  - it: should set automountServiceAccountToken to false
    set:
      serviceAccount:
        automount: false
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: should set annotations
    set:
      serviceAccount:
        annotations:
          example.com/test: "true"
    asserts:
      - equal:
          path: metadata.annotations["example.com/test"]
          value: "true"