suite: ConfigMap tests

templates:
  - templates/configmap-envjs.yaml

tests:
  - it: should create a ConfigMap with the generated name when no existingConfigMap given
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: tc-query-ui-envjs   

  - it: should not create a ConfigMap when existingConfigMap is given
    set:
      configMap:
        existingConfigMap: existing-cm
    asserts:
      - hasDocuments:
          count: 0