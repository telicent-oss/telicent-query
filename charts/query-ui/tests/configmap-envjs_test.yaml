suite: ConfigMap tests

templates:
  - templates/configmap-envjs.yaml

tests:
  - it: should create a ConfigMap with the generated name when no existingConfigMap given
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: tc-query-ui-envjs   

  - it: should not create a ConfigMap when existingConfigMap is given
    set:
      configMap:
        existingConfigMap: existing-cm
    asserts:
      - hasDocuments:
          count: 0
  - it: should write the default datasets to env-config.js
    asserts:
      - matchRegex:
          path: data["env-config.js"]
          pattern: 'window\.DATASETS = \["knowledge","ontology","catalog"\];'

  - it: should leave DATASETS out of env-config.js when datasets is null
    set:
      datasets: null
    asserts:
      - notMatchRegex:
          path: data["env-config.js"]
          pattern: 'window\.DATASETS'

  - it: should fail when datasets is an empty list
    set:
      datasets: []
    asserts:
      - failedTemplate:
          errorMessage: datasets must list at least one dataset
