suite: Deployment tests

templates:
  - templates/deployment.yaml
  - templates/configmap-envjs.yaml

set:
  replicas: 2
  revisionHistoryLimit: 5
  image:
    repository: quay/query-ui
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  resources: {}
  podSecurityContext: {}
  containerSecurityContext: {}

tests:
  - it: should create a Deployment
    template: templates/deployment.yaml
    asserts:
      - isKind:
          of: Deployment

  - it: should set the replica count
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  - it: should build the image from registry, repository and tag
    template: templates/deployment.yaml
    set:
      global:
        imageRegistry: registry.io
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.io/quay/query-ui:1.0.0

  - it: should fall back to Chart.AppVersion when image.tag is not set
    template: templates/deployment.yaml
    set:
      global:
        imageRegistry: registry.io
      image:
        repository: quay/query-ui
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '^registry\.io/quay/query-ui:.+$'

   - it: should default the pod securityContext per policy
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            runAsUser: 185
            runAsGroup: 185
            runAsNonRoot: true

  - it: should default the container securityContext per policy
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
