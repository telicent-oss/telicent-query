suite: Deployment tests

templates:
  - templates/deployment.yaml

set:
  replicas: 2
  revisionHistoryLimit: 5
  image:
    repository: quay/query-ui
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  resources: {}
  podSecurityContext: {}
  containerSecurityContext: {}

tests:
  - it: should create a Deployment
    asserts:
      - isKind:
          of: Deployment

  - it: should set the replica count
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  - it: should build the image from registry, repository and tag
    set:
      global:
        imageRegistry: registry.io
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.io/quay/query-ui:1.0.0

  - it: should fall back to Chart.AppVersion when image.tag is not set
    set:
      global:
        imageRegistry: my-registry.io
      image:
        repository: myrepo/query-ui
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '^registry\.io/quay/query-ui:.+$'

  - it: should use global imagePullSecrets when set
    set:
      global:
        imagePullSecrets:
          - name: global-secret
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: global-secret

  - it: should fall back to image.pullSecrets when global is not set
    set:
      image:
        pullSecrets:
          - name: default-image-secret
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: default-image-secret

  - it: should not include env when extraEnvVars not set
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env

  - it: should reference the configmap in the volume
    set:
      configMap:
        existingConfigMap: query-ui-cm
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].configMap.name
          value: query-ui-cm